services:
  postgres:
    image: postgres:17
    container_name: lanche-falcao-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lanche_falcao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: